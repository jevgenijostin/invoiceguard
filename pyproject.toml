[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceguard"
version = "0.1.0"
description = "Offline CSV invoice duplicate detection"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
invoiceguard = "invoiceguard.cli:main"

[tool.setuptools.packages.find]
include = ["invoiceguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
